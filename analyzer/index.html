<!doctype html>
<html lang="en" data-theme="replay-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171b29" />
    <script>
      try {
        const theme = localStorage.getItem('replay-theme') === 'replay' ? 'replay' : 'replay-dark';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'replay' ? '#f3f4f9' : '#171b29';
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Replay Analyzer — HaxBall Match Analysis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
