{% if messages %}
  <div id="alerts-container" class="tw:flex tw:flex-col tw:gap-y-1">
    {% for message in messages %}
      <div class="alert {{ message.tags }} alert-dismissible fade show tw:mb-1!" role="alert">
        <div class="tw:font-semibold">{{ message }}</div>
        <button type="button" class="close tw:cursor-pointer tw:font-semibold" data-dismiss="alert" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
