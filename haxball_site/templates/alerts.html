<div id="alerts-container">
  {% if messages %}
    {% for message in messages %}
      <div class="alert {{ message.tags }} alert-dismissible fade show tw:mb-2!" role="alert">
        <div class="tw:font-semibold">{{ message }}</div>
        <button type="button" class="close tw:cursor-pointer tw:font-semibold" data-dismiss="alert" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
    {% endfor %}
  {% endif %}
</div>
