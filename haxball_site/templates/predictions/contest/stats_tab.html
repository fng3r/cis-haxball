<div class="tw:space-y-4">
  {% if not selected_tournament %}
    <div class="tw:text-center tw:text-base-content/70 tw:py-8">Данная секция будет доступна после запуска турниров</div>
  {% elif not is_coefficients %}
    <div class="tw:text-center tw:text-base-content/70 tw:py-8">Статистика доступна только для турниров в формате «Коэффициенты»</div>
  {% else %}
    <div class="tw:tabs tw:tabs-border" role="tablist">
      <label class="tw:tab" role="tab">
        <input type="radio" name="predictions-statistics-tabs" checked />
        <span class="tw:flex tw:items-center tw:gap-2">
          <i class="fa fa-bar-chart" aria-hidden="true"></i>
          Общая
        </span>
      </label>
      <div class="tw:tab-content tw:pt-4" role="tabpanel">{% include 'predictions/contest/general_stats_tab.html' %}</div>

      <label class="tw:tab" role="tab">
        <input type="radio"
               name="predictions-statistics-tabs"
               hx-get="{% url 'predictions:personal_stats_tab' %}?tournament={{ selected_tournament.pk }}"
               hx-target="#personal-stats-content"
               hx-trigger="load" />
        <span class="tw:flex tw:items-center tw:gap-2">
          <i class="fa fa-user" aria-hidden="true"></i>
          Личная
        </span>
      </label>
      <div id="personal-stats-content" class="tw:tab-content tw:pt-4" role="tabpanel">
        <div class="tw:flex tw:justify-center tw:items-center tw:py-8">
          <div class="tw:loading tw:loading-spinner tw:loading-lg"></div>
        </div>
      </div>
    </div>
  {% endif %}
</div>
