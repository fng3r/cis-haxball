{% extends "core.html" %}

{% load static %}
{% load widget_tweaks %}

{% block title %}Прогнозы — CIS-HAXBALL{% endblock %}

{% block main_content %}
  <div class="tw:card tw:bg-base-100 tw:rounded-lg">
    <div class="tw:w-full tw:flex tw:justify-center tw:align-center tw:bg-base-300 tw:rounded-t-lg tw:py-2 tw:border-b tw:border-gray-300">
      <div class="tw:card-title tw:py-1">
        <h3 class="tw:text-center">Прогнозы</h3>
      </div>
    </div>

    <div class="tw:card-body tw:p-0">
      {# Top-level Tabs #}
      <div class="tw:tabs tw:tabs-box tw:bg-base-100 tw:shadow-none" role="tablist">
        <label class="tw:tab tw:has-[input:checked]:bg-base-300 tw:flex-1"
               id="predictions-contest-tab"
               role="tab"
               aria-label="Турнир прогнозистов"
               aria-controls="predictions-contest-content">
          <input type="radio" name="predictions-tabs" checked />
          <span class="tw:flex tw:items-center tw:gap-2">Турнир прогнозистов</span>
        </label>
        <div id="predictions-contest-content"
             class="tw:tab-content tw:px-1 tw:py-2"
             role="tabpanel"
             aria-labelledby="predictions-contest-tab">{% include 'predictions/contest/container.html' %}</div>

        <label class="tw:tab tw:has-[input:checked]:bg-base-300 tw:flex-1"
               id="preseason-predictions-tab"
               role="tab"
               aria-label="Прогнозы на сезон"
               aria-controls="preseason-predictions-content">
          <input type="radio"
                 name="predictions-tabs"
                 hx-get="{% url 'predictions:preseason' %}?tournament={{ selected_preseason_tournament.pk }}"
                 hx-target="#preseason-predictions-content"
                 hx-trigger="load" />
          <span class="tw:flex tw:items-center tw:gap-2">Прогнозы на сезон</span>
        </label>
        <div id="preseason-predictions-content"
             class="tw:tab-content tw:px-1 tw:py-2"
             role="tabpanel"
             aria-labelledby="preseason-predictions-tab">
          <div class="tw:flex tw:justify-center tw:items-center tw:py-8">
            <div class="tw:loading tw:loading-spinner tw:loading-lg"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
{% endblock %}
