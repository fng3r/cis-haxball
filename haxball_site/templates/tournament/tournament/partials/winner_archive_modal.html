<dialog id="winner_archive_modal" class="tw:modal">
  <div class="tw:modal-box tw:max-w-2xl tw:max-h-[90vh]">
    <h3 class="tw:flex tw:items-center tw:gap-1 tw:mb-4 tw:text-lg tw:font-bold">
      {{ league.title }}
      <span class="tw:mt-1 tw:text-2xl">🏆</span>
    </h3>

    {% if winners %}
      <div class="tw:space-y-2">
        {% for season, winners_by_season in winners.items %}
          <div class="tw:card tw:bg-base-100 tw:shadow-md tw:border tw:border-base-300">
            <div class="tw:card-body tw:py-3">
              <div class="tw:flex tw:items-center tw:gap-4">
                <div class="tw:badge tw:badge-primary tw:min-w-20 tw:shrink-0">{{ season.short_title }}</div>
                <div class="tw:flex tw:flex-col tw:flex-1 tw:gap-2.5">
                  {% for winner in winners_by_season %}
                    <div class="tw:flex tw:justify-between tw:items-center">
                      <div class="tw:flex tw:items-center tw:gap-2">
                        <img src="{{ winner.winner.logo.url }}" alt="{{ winner.winner.title }}" class="tw:w-8 tw:h-8 tw:rounded">
                        <a href="{{ winner.winner.get_absolute_url }}" class="tw:link tw:link-hover tw:text-2xl tw:font-semibold">{{ winner.winner.title }}</a>
                      </div>
                      <a href="{{ winner.league.get_absolute_url }}" class="tw:opacity-70 tw:hover:opacity-100">
                        <i class="fa fa-chevron-right" aria-hidden="true"></i>
                      </a>
                    </div>
                  {% endfor %}
                </div>
              </div>
            </div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="tw:text-center tw:py-8">
        <p class="tw:text-base-content/80">Победители этого турнира еще не были определены</p>
      </div>
    {% endif %}
  </div>
  <form method="dialog" class="tw:modal-backdrop">
    <button>close</button>
  </form>
</dialog>
