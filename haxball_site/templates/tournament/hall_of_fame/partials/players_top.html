{% load static %}

<div class="col px-1">
    <div class="card" style="border-radius: 25px;">
        <div class="card-header px-1"
             style="background: linear-gradient(to right, rgba(193, 243, 229, 0.7), rgba(91, 142, 241, 0.32)); border-radius: 25px 25px 0 0;">
            <h5 class="mb-0 font-weight-bold">
                {{ title }}
                {% if icon_url %}
                    <img src="{% static icon_url %}" width="24" height="24" title="{{ title }}">
                {% elif icon_cls %}
                    <i class="{{ icon_cls }}" title="Выходов на замену" aria-hidden="true" style="font-size: 21px"></i>
                {% endif %}
            </h5>
        </div>

        <div class="card-body p-0" style="position: relative; height: 500px; overflow-y: auto; border-radius: 0 0 25px 25px;">
            <table class="table table-hover mb-0">
                <tbody>
                    {% for player in players %}
                        <tr>
                            <td class="pl-1 pr-2">
                                <div class="d-flex">
                                    <div class="mr-2" style="width: 28px;">
                                        <span class="h6 mb-0 text-center">{{ forloop.counter }}</span>
                                    </div>

                                    <div class="d-flex mr-1">
                                        <img src="{{ player.name.user_profile.avatar.url }}" width="25" height="25" class="d-inline" style="border-radius: 100%">
                                        {% if player.team %}
                                            <img src="{{ player.team.logo.url }}" width="20" height="20" style="position: relative; left: -11px; bottom: -11px;">
                                        {% else %}
                                            <img src="{% static "img/ico/free_player.png" %}" width="20" height="20" style="position: relative; left: -10px; bottom: -13px;">
                                        {% endif %}
                                    </div>

                                    <div class="text-left">
                                        {% if player.name %}
                                            <a class="text-dark h6" href="{{ player.name.user_profile.get_absolute_url }}">
                                                {{ player.nickname }}
                                            </a>
                                        {% else %}
                                            <span class="text-secondary h6">{{ player.nickname }}</span>
                                        {% endif %}
                                    </div>

                                    <div class="ml-auto">
                                        <span class="font-weight-bold h6">{{ player.count }}</span>
                                    </div>

                                </div>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
