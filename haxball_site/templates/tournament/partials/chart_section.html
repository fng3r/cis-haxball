<div class="tw:card tw:pt-1 tw:pb-2 tw:border-0">
  <div class="tw:bg-base-100 tw:collapse tw:collapse-arrow tw:border tw:border-base-300">
    <input type="checkbox" class="tw:peer" />
    <div class="tw:collapse-title tw:text-center tw:bg-primary tw:text-primary-content">{{ title }}</div>

    <div class="tw:collapse-content">
      <div class="tw:flex tw:flex-col tw:gap-2">
        {% for chart in charts.bar_charts %}
          {% if chart %}<div class="chart">{{ chart|safe }}</div>{% endif %}
        {% endfor %}

        <div class="row">
          {% for chart in charts.pie_charts %}
            {% if chart %}<div class="chart col-6">{{ chart|safe }}</div>{% endif %}
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</div>
