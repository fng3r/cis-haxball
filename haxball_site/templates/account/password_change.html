{% extends "core.html" %}

{% load i18n %}

{% block title %}
  {% trans "Change Password" %}
{% endblock %}

{% block main_content %}
  <div class="tw:card tw:bg-base-100 tw:rounded-lg">
    <h2 class="tw:text-center tw:py-2">{% trans "Change Password" %}</h2>
    <div class="tw:card-body tw:pt-2">
      <form method="POST" action="{% url 'account_change_password' %}" class="password_change">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" name="action">{% trans "Change Password" %}</button>
      </form>
    </div>
  </div>
{% endblock %}
