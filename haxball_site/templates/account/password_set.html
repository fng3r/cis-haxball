{% extends "core.html" %}

{% load i18n %}

{% block title %}
  {% trans "Set Password" %}
{% endblock %}

{% block main_content %}
  <div class="tw:card tw:bg-base-100 tw:rounded-lg">
    <h2 class="tw:text-center tw:py-2">{% trans "Set Password" %}</h2>
    <div class="tw:card-body tw:pt-2">
      <form method="POST" action="{% url 'account_set_password' %}" class="password_set">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" name="action" value="{% trans 'Set Password' %}" />
      </form>
    </div>
  </div>
{% endblock %}
