{% extends "core/home.html" %}
{% load static %}
{% load cache %}

{% block scripts %}
    <!-- Аякс-скрипт проставления лайков-дизлайков к постам -->
    <script type="text/javascript" src="{% static "core/js/like-dislike.js" %}"></script>

{% endblock %}

{% block postlist %}
    <div class="tw:card tw:mt-2 tw:bg-base-100 tw:rounded-4xl">
        <div class="tw:card-body tw:rounded-t-4xl tw:gap-0 tw:py-4">
            <h3 class="tw:text-center tw:mb-0">
                <i class="fa fa-list-alt tw:text-primary" aria-hidden="true"></i> Последние посты
            </h3>
            <div class="tw:divider tw:my-0!"></div>

            {% for post in posts %}
                {% include "core/include/post_in_list.html" with post=post is_on_homepage=True %}
            {% endfor %}
        </div>

        <div class="tw:card-body tw:rounded-b-4xl tw:bg-base-200 tw:border-t tw:border-gray-300 tw:py-2!">
            <a href="{% url 'core:all_posts' %}">Смотреть все посты</a>
        </div>
    </div>
{% endblock %}
