{% load static %}

<div class="tw:card tw:bg-base-100 tw:rounded-lg tw:shadow-sm tw:border tw:border-base-200">
  <div class="tw:px-4 tw:py-3 tw:bg-base-200 tw:rounded-t-lg{% if users_online_count > 0 %} tw:border-b tw:border-base-300{% else %} tw:rounded-b-lg{% endif %}">
    <h5 class="tw:text-sm tw:font-semibold tw:text-base-content/90 tw:flex tw:items-center tw:justify-between tw:mb-0!">
      <span class="tw:flex tw:items-center tw:gap-2">
        <i class="fa fa-users tw:text-primary" aria-hidden="true"></i>
        Онлайн
      </span>
      <span class="tw:badge tw:badge-sm tw:badge-success tw:font-medium">{{ users_online_count }}</span>
    </h5>
  </div>
  {% if users_online_count > 0 %}
    <div class="tw:max-h-[255px] tw:overflow-y-auto tw:px-1.5 tw:py-2 tw:space-y-1">
      {% for user in users_online %}
        <a href="{{ user.user_profile.get_absolute_url }}"
           class="tw:flex tw:items-center tw:gap-2 tw:px-3 tw:py-2 tw:rounded-lg tw:hover:bg-base-200 tw:active:translate-y-[0.5px] tw:transition-transform">
          <span class="tw:status tw:status-md tw:status-success" aria-label="online"></span>
          <span class="tw:text-sm tw:font-medium">{{ user }}</span>
          {% for icon in user.user_profile.user_icon.all %}
            <img src="{{ icon.image.url }}" width="15px" height="15px" title="{{ icon.description }}" class="tw:shrink-0">
          {% endfor %}
        </a>
      {% endfor %}
    </div>
  {% endif %}
</div>
