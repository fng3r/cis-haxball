{% load static %}
{% load tournament_extras %}
{% load widget_tweaks %}

{% if matches %}
  <form id="reservation-form"
        class="tw:flex tw:flex-wrap tw:items-center tw:gap-2"
        hx-trigger="submit"
        hx-post="{% url 'reservation:host_reservation' %}"
        hx-target="#content-container"
        hx-swap="outerHTML"
        hx-disabled-elt="find button">
    <input type="hidden" name="author" value="{{ user.id }}">

    <div class="tw:flex tw:flex-wrap tw:items-center">
      <label for="match" class="tw:label tw:text-base-content tw:font-bold">Матч</label>
      <select id="match" name="match" class="tw:select">
        {% for m in matches %}
          <option {% if forloop.first %}selected{% endif %} value="{{ m.id }}">
            {{ m.numb_tour|tour_name }}, {{ m.team_home.title }}-{{ m.team_guest.title }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="tw:flex tw:flex-wrap tw:items-center">
      <label for="match_date" class="tw:label tw:text-base-content tw:font-bold">Дата матча</label>
      <select class="tw:select" id="match_date" name="match_date">
        <option value="{{ date_today|date:"Y-m-d" }}" selected>Сегодня</option>
        <option value="{{ date_tomorrow|date:"Y-m-d" }}">Завтра</option>
      </select>
    </div>

    <div class="tw:flex tw:flex-col tw:justify-center">
      <label for="match_time" class="tw:label tw:text-base-content tw:font-bold">Время матча</label>
      <div class="tw:flex tw:items-center tw:gap-2">
        <select class="tw:select" id="match_hour" name="match_hour">
          {% for hour in hours_list %}
            <option {% if forloop.first %}selected{% endif %} value="{{ hour }}">{{ hour }}</option>
          {% endfor %}
        </select>
        <select class="tw:select" id="match_minute" name="match_minute">
          {% for minute in minutes_list %}
            <option {% if forloop.first %}selected{% endif %} value="{{ minute }}">{{ minute }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="tw:flex tw:flex-wrap tw:items-center">
      <label for="match_host" class="tw:label tw:text-base-content tw:font-bold">Хост</label>
      <select class="tw:select" id="match_host" name="match_host">
        {% for host in hosts %}
          <option {% if forloop.first %}selected{% endif %} value="{{ host.id }}">{{ host.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="tw:flex tw:mt-auto">
      <button type="submit" class="tw:btn tw:btn-primary tw:items-center">
        <i class="fa fa-clock-o" aria-hidden="true"></i>Забронировать хост
      </button>
      <img id="free-agents-actions-indicator" class="htmx-indicator tw:ml-2 tw:w-6" src="{% static 'img/svg-loaders/bars.svg' %}">
    </div>
  </form>
{% else %}
  <div role="alert" class="tw:alert tw:alert-info tw:gap-2">
    <i class="fa fa-info-circle" aria-hidden="true"></i>
    <span>У Вас сыграны/забронированы все матчи</span>
  </div>
{% endif %}
