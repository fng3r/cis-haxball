{% load utils %}

{% with form_field=form|get:field %}
  <div class="tw:flex tw:flex-col tw:gap-1 tw:flex-1" x-data="{isModalOpen:false}">
    <label class="tw:label tw:text-base-content tw:font-bold">{{ form_field.label }}</label>
    <input type="hidden" name="{{ field }}" :value="selected.{{ field }}.id" />
    <button type="button" class="tw:btn tw:btn-neutral tw:justify-between" @click="isModalOpen=true">
      <span x-text="selected.{{ field }}.label || 'Выбрать игрока'"></span>
      <i class="fa fa-user"></i>
    </button>

    <div class="tw:modal" :class="isModalOpen ? 'tw:modal-open' : ''">
      <div class="tw:modal-box tw:max-w-md tw:md:max-w-3xl">
        <h3 class="tw:font-bold tw:text-lg tw:mb-3">Выбор игрока</h3>
        <div class="tw:grid tw:grid-cols-1 tw:md:grid-cols-2 tw:gap-3">
          {% for player in form_field.field.queryset %}
            <button type="button"
                    class="tw:btn tw:justify-start tw:gap-3"
                    :class="selected.{{ field }}.id == {{ player.pk }} && 'tw:btn-primary'"
                    x-data="{ field: '{{ field }}', pk: {{ player.pk }}, cost: parseFloat('{{ form.player_costs|get:player.pk }}'.replace(',', '.')), label: '{{ player.nickname|escapejs }} — {{ form.player_costs|get:player.pk }} M' }"
                    @click="handlePick(field, pk, cost, label); isModalOpen=false;">
              <img src="{{ player.team.logo.url }}" alt="logo" class="tw:w-6 tw:h-6 tw:rounded-sm" />
              <span>{{ player.nickname }}</span>
              <span class="tw:text-xs tw:opacity-70">{{ form.player_costs|get:player.pk }}M</span>
            </button>
          {% endfor %}
        </div>
        <div class="tw:modal-action">
          <button type="button" class="tw:btn" @click="isModalOpen=false">Закрыть</button>
        </div>
      </div>
      <div class="tw:modal-backdrop" @click="isModalOpen=false"></div>
    </div>
  </div>
{% endwith %}
