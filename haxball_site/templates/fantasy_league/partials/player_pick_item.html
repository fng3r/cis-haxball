{% load utils %}

{% with form_field=form|get:field %}
  <div class="tw:flex tw:flex-col tw:gap-1 tw:flex-1" x-data="{position: '{{ field }}', isModalOpen:false}">
    <label class="tw:label tw:text-base-content tw:font-bold">{{ form_field.label }}</label>
    <input type="hidden" name="{{ field }}" :value="selected[position]?.id" />
    <div class="tw:flex tw:items-center tw:gap-2">
      <button type="button" class="tw:btn tw:btn-neutral tw:justify-between tw:flex-1" @click="isModalOpen=true">
        <template x-if="selected[position]">
          <div class="tw:flex tw:items-center tw:gap-2">
            <img :src="selected[position]?.teamLogo" alt="logo" class="tw:w-6 tw:h-6 tw:rounded-sm" />
            <span x-text="selected[position]?.nickname"></span>
            <span class="tw:text-xs tw:opacity-70 tw:ml-1" x-text="`${selected[position]?.cost}M`"></span>
          </div>
        </template>
        <template x-if="!selected[position]">
          <span x-text="`Выберите игрока`"></span>
        </template>

        <i class="fa fa-user"></i>
      </button>

      <svg version="1.1"
           xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 64 64"
           class="tw:size-6 tw:cursor-pointer"
           :class="{'tw:grayscale-75': !selected[position] || selectedCaptain !== selected[position].id}"
           @click="if (selected[position] && selectedCaptain === selected[position].id) { selectedCaptain = null } else if (selected[position]) { selectedCaptain = selected[position].id }">

        <path d="M0 0 C0.9375 2.75 0.9375 2.75 1 5 C-7.54680766 13.10850983 -17.95329052 14.20202625 -29.375 14.125 C-30.50143921 14.11774902 -30.50143921 14.11774902 -31.65063477 14.11035156 C-41.89546496 13.99927241 -51.07777881 13.2695083 -59.6875 7.0625 C-61 5 -61 5 -60.85546875 2.5390625 C-60 0 -60 0 -58.1015625 -1.51171875 C-42.2535618 -9.03576956 -14.71619342 -11.63605991 0 0 Z " fill="#617D8A" transform="translate(62,13)" />

      </svg>
    </div>

    <div class="tw:modal" :class="isModalOpen ? 'tw:modal-open' : ''">
      <div class="tw:modal-box tw:max-w-md tw:md:max-w-3xl">
        <h3 class="tw:font-bold tw:text-lg tw:mb-3">Выбор игрока</h3>
        <div class="tw:grid tw:grid-cols-1 tw:md:grid-cols-2 tw:gap-3">
          {% for player in form_field.field.queryset %}
            <button type="button"
                    class="tw:btn tw:gap-2"
                    :class="selected[position]?.id == {{ player.pk }} && 'tw:btn-primary'"
                    x-data="{ id: {{ player.pk }}, nickname: '{{ player.nickname|escapejs }}', cost: parseCost('{{ form.player_costs|get:player.pk }}'), teamLogo: '{{ player.team.logo.url }}' }"
                    @click="handlePick(position, id, nickname, cost, teamLogo); isModalOpen=false; if (selectedCaptain === id) { selectedCaptain = id }">
              <img :src="teamLogo" alt="logo" class="tw:w-6 tw:h-6 tw:rounded-sm" />
              <span x-text="nickname"></span>
              <span class="tw:text-xs tw:opacity-70 tw:ml-1" x-text="`${cost}M`"></span>
            </button>
          {% endfor %}
        </div>
        <div class="tw:modal-action">
          <button type="button" class="tw:btn" @click="isModalOpen=false">Закрыть</button>
        </div>
      </div>
      <div class="tw:modal-backdrop" @click="isModalOpen=false"></div>
    </div>
  </div>
{% endwith %}
