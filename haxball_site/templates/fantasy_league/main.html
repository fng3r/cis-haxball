{% extends "core.html" %}

{% load static %}
{% load widget_tweaks %}

{% block title %}Фэнтези Лига — CIS-HAXBALL{% endblock %}

{% block main_content %}
  <div class="tw:card tw:bg-base-100 tw:rounded-lg">
    <div class="tw:w-full tw:flex tw:justify-center tw:align-center tw:bg-base-300 tw:rounded-t-lg tw:py-2 tw:border-b tw:border-gray-300">
      <div class="tw:card-title tw:py-1">
        <h3 class="tw:text-center">Фэнтези Лига</h3>
      </div>
    </div>

    <div class="tw:card-body tw:p-1">
      <div class="tw:tabs tw:tabs-border" role="tablist">
        <label class="tw:tab" role="tab">
          <input type="radio" name="fantasy-tabs" checked />
          <span class="tw:flex tw:items-center tw:gap-2">
            <i class="fa fa-users"></i>
            Мой состав
          </span>
        </label>
        <div id="make-squad-content" class="tw:tab-content tw:p-2" role="tabpanel">{{ make_squad_tab_html|safe }}</div>

        <label class="tw:tab" role="tab">
          <input type="radio"
                 name="fantasy-tabs"
                 hx-get="{% url 'fantasy_league:view_squads_tab' %}?tournament={{ selected_tournament.pk }}"
                 hx-target="#view-squads-content"
                 hx-trigger="load delay:2s" />
          <span class="tw:flex tw:items-center tw:gap-2">
            <i class="fa fa-th-list"></i>
            Все составы
          </span>
        </label>
        <div id="view-squads-content" class="tw:tab-content tw:p-2" role="tabpanel">
          <div class="tw:flex tw:justify-center tw:items-center tw:py-8">
            <div class="tw:loading tw:loading-spinner tw:loading-lg"></div>
          </div>
        </div>

        <label class="tw:tab" role="tab">
          <input type="radio"
                 name="fantasy-tabs"
                 hx-get="{% url 'fantasy_league:top_squads_tab' %}?tournament={{ selected_tournament.pk }}"
                 hx-target="#top-squads-content"
                 hx-trigger="load delay:2s" />
          <span class="tw:flex tw:items-center tw:gap-2">
            <i class="fa fa-star"></i>
            Топ-составы
          </span>
        </label>
        <div id="top-squads-content" class="tw:tab-content tw:p-2" role="tabpanel">
          <div class="tw:flex tw:justify-center tw:items-center tw:py-8">
            <div class="tw:loading tw:loading-spinner tw:loading-lg"></div>
          </div>
        </div>

        <label class="tw:tab" role="tab">
          <input type="radio"
                 name="fantasy-tabs"
                 hx-get="{% url 'fantasy_league:standings_tab' %}?tournament={{ selected_tournament.pk }}"
                 hx-target="#standings-content"
                 hx-trigger="load delay:2s" />
          <span class="tw:flex tw:items-center tw:gap-2">
            <i class="fa fa-trophy"></i>
            Турнирная таблица
          </span>
        </label>
        <div id="standings-content" class="tw:tab-content tw:p-2" role="tabpanel">
          <div class="tw:flex tw:justify-center tw:items-center tw:py-8">
            <div class="tw:loading tw:loading-spinner tw:loading-lg"></div>
          </div>
        </div>

        {% comment %}
        <label class="tw:tab" role="tab">
          <input type="radio" name="fantasy-tabs" hx-get="{% url 'fantasy_league:statistics_tab' %}?tournament={{ selected_tournament.pk }}" hx-target="#statistics-content" hx-trigger="load delay:2s" />
          <span class="tw:flex tw:items-center tw:gap-2">
            <i class="fa fa-bar-chart"></i>
            Статистика игроков
          </span>
        </label>
        <div id="statistics-content" class="tw:tab-content tw:p-2" role="tabpanel">
          <div class="tw:flex tw:justify-center tw:items-center tw:py-8">
            <div class="tw:loading tw:loading-spinner tw:loading-lg"></div>
          </div>
        </div>
        {% endcomment %}

        <label class="tw:tab" role="tab">
          <input type="radio" name="fantasy-tabs" />
          <span class="tw:flex tw:items-center tw:gap-2">
            <i class="fa fa-book"></i>
            Правила
          </span>
        </label>

        <div id="rules-content" class="tw:tab-content tw:p-2" role="tabpanel">{% include 'fantasy_league/partials/rules.html' %}</div>
      </div>
    </div>
  </div>
{% endblock %}
