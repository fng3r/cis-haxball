{% load i18n %}

<div class="tw:flex tw:items-start tw:gap-2 tw:p-2 {% if not notification.unread %}tw:bg-base-200{% endif %} tw:rounded-md tw:mb-1"
     id="dropdown-notification-{{ notification.id }}"
     x-data="{notifcationId: {{ notification.id }}, isUnread: '{{ notification.unread }}' === 'True', isRemoved: false}"
     x-show="!isRemoved && isUnread"
     @notification-read.window="if (notifcationId === $event.detail.id) { isUnread = false }"
     @all-notifications-read.window="isUnread = false"
     @notification-removed.window="if (notifcationId === $event.detail.id) { isRemoved = true }"
>
  <div class="tw:flex-shrink-0">
    {% if notification.actor.user_profile.avatar %}
      <a href="{{ notification.actor.user_profile.get_absolute_url }}">
        <img src="{{ notification.actor.user_profile.avatar.url }}" title="{{ notification.actor }}" class="tw:w-8 tw:h-8 tw:rounded-full">
      </a>
    {% else %}
      <div class="tw:w-8 tw:h-8 tw:rounded-full tw:bg-primary tw:flex tw:items-center tw:justify-center">
        <span class="tw:text-primary-content tw:text-xs">{{ notification.actor.username|slice:":1" }}</span>
      </div>
    {% endif %}
  </div>
  <div class="tw:flex-1">
    {% include "notifications/notification_content.html" with is_list_view=False %}
  </div>
  <div class="tw:flex-shrink-0 tw:flex tw:gap-1">
    <div type="button" class="tw:btn tw:btn-xs tw:btn-ghost tw:btn-circle"
         hx-post="{% url 'notifications:mark_as_read' notification.id %}"
         hx-target="#dropdown-notification-{{ notification.id }}"
         hx-swap="none"
         hx-trigger="click"
         @click.stop="isUnread = false"
         title="Отметить как прочитанное">
      <svg xmlns="http://www.w3.org/2000/svg" class="tw:h-4 tw:w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
    </div>
  </div>
</div>
