{% load static %}

<div class="tw:flex tw:flex-col tw:gap-5">
  <div class="tw:flex tw:flex-col tw:lg:flex-row tw:gap-6">
    <div class="tw:flex tw:items-center tw:justify-center tw:bg-base-200 tw:rounded-lg tw:p-4 tw:lg:w-1/3 tw:min-h-[220px]">
      {% if item.image %}
        <img src="{{ item.image.url }}" alt="{{ item.name }}" class="tw:max-h-48 tw:w-auto tw:object-contain">
      {% else %}
        <img src="{% static 'img/cis-coin.png' %}" alt="{{ item.name }}" class="tw:max-h-48 tw:w-auto tw:object-contain">
      {% endif %}
    </div>

    <div class="tw:flex-1 tw:flex tw:flex-col tw:gap-3">
      <div>
        <h2 class="tw:text-2xl tw:font-semibold tw:mb-2">{{ item.name }}</h2>
        <div class="tw:text-lg tw:font-semibold tw:text-primary">Цена: {{ item.price }} CC</div>
      </div>

      {% if item.description %}<p class="tw:text-sm tw:text-base-content/80">{{ item.description }}</p>{% endif %}

      {% if not can_afford %}
        <div class="tw:text-sm tw:text-error tw:bg-error/10 tw:rounded-md tw:px-3 tw:py-2">Недостаточно средств на балансе</div>
      {% endif %}
    </div>
  </div>
</div>
