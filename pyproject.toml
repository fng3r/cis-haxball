[project]
name = "cis-haxball"
version = "1.0.0"
description = "Website for holding HaxBall tournaments with social component"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django-allauth==65.15.0",
    "django-autoslug==1.9.9",
    "django-oauth-toolkit==3.1.0",
    "django-ckeditor==6.7.3",
    "django-colorfield==0.14.0",
    "django-debug-toolbar==6.2.0",
    "django-extensions==4.1",
    "django-filter==25.2",
    "django-htmx==1.27.0",
    "django-mathfilters==1.0.0",
    "django-model-utils==5.0.0",
    "django-online-users==0.3",
    "django-polymorphic==4.11.2",
    "django-smart-selects==1.7.2",
    "django-summernote==0.8.20.0",
    "django-widget-tweaks==1.5.1",
    "django==6.0.3",
    "gunicorn==20.0.4",
    "ipython==9.12.0",
    "pandas==2.2.3",
    "pillow==10.4.0",
    "plotly==5.24.1",
    "psycopg2==2.9.10",
    "python-decouple==3.8",
    "python3-openid==3.2.0",
    "pytils==0.3",
    "requests==2.31.0",
    "sorl-thumbnail==13.0.0",
    "google-api-python-client==2.164.0",
    "isodate==0.7.2",
    "django-notifications-hq==1.8.3",
    "django-vite==3.1.0",
    "django-unfold==0.105.0",
    "celery[redis]==5.6.3",
    "django-celery-beat==2.9.0",
    "django-celery-results==2.6.0",
]

[dependency-groups]
dev = [
    "djhtml==3.0.11",
    "pre-commit==4.5.1",
    "ruff==0.15.8",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "N", "SIM", "RET", "E501", "UP007", "UP032"]
ignore = ["E722", "SIM108", "RET504"]

[tool.ruff.lint.isort]
extra-standard-library = ["isodate"]
known-first-party = ["haxball_site", "core", "tournament", "polls", "reservation", "custom_notifications", "predictions", "fantasy_league"]
section-order = [
  "future",
  "standard-library",
  "django",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]

[tool.ruff.format]
quote-style = "single"

[tool.djlint]
profile = "django"
indent=2
max_line_length=140
max_attribute_length=120
max_blank_lines=1
blank_line_after_tag="load,extends"
custom_blocks="partialdef,cache"
format_css = true
format_js = false

[tool.djlint.css]
indent_size=2
